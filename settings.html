<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Settings | HEXA</title>


  <!-- GLOBAL HEXA HEADER -->
  <link
    rel="stylesheet"
    href="hexa-header.css"
  >


  <!-- SETTINGS -->
  <link
    rel="stylesheet"
    href="settings.css"
  >

</head>


<body>


  <!-- ==================================================
       GLOBAL HEXA HEADER
       ================================================== -->

  <header
    id="hexaHeader"
    data-header-type="standard"
    data-page="settings"
  ></header>



  <!-- ==================================================
       SETTINGS PAGE
       ================================================== -->

  <main
    id="settingsPage"
    class="settings-page"
  >


    <!-- =================================================
         STICKY SETTINGS HEADING

         Dibuat terpisah dari content agar card yang
         discroll ke atas tidak terlihat menembus
         di belakang heading.
         ================================================= -->

    <section class="settings-heading-shell">

      <div class="settings-heading">

        <img
          class="settings-heading-icon"
          src="HEXA-ICON-svg-settings-page.svg"
          alt=""
          aria-hidden="true"
        >


        <div class="settings-heading-text">

          <h1>
            Settings
          </h1>

          <p>
            Account &amp; Application Management
          </p>

        </div>

      </div>

    </section>



    <!-- =================================================
         PAGE CONTENT
         ================================================= -->

    <section class="settings-container">


      <!-- =================================================
           PROFILE / MY PROFILE

           Card ini sekaligus menjadi shortcut
           menuju halaman My Profile.
           ================================================= -->

      <button
        type="button"
        id="settingsProfileCard"
        class="settings-profile-card"
        aria-label="Open My Profile"
      >


        <!-- PROFILE PHOTO -->

        <span class="settings-profile-photo">

          <img
            id="settingsProfilePhoto"
            src=""
            alt=""
          >

          <span
            id="settingsProfileInitial"
            class="settings-profile-initial"
            aria-hidden="true"
          >
            US
          </span>

        </span>



        <!-- PROFILE INFORMATION -->

        <span class="settings-profile-info">


          <!-- NAME -->

          <span class="settings-profile-name-row">

            <strong
              id="settingsProfileName"
              class="settings-profile-name"
            >
              User Name
            </strong>


            <!-- VERIFIED / ACTIVE ACCOUNT -->

            <span
              class="settings-verified"
              title="Active Account"
              aria-label="Active Account"
            >

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="
                    M12 2.5
                    14.1 4
                    16.7 3.8
                    17.6 6.2
                    20 7.3
                    19.6 9.9
                    21.5 12
                    19.6 14.1
                    20 16.7
                    17.6 17.8
                    16.7 20.2
                    14.1 20
                    12 21.5
                    9.9 20
                    7.3 20.2
                    6.4 17.8
                    4 16.7
                    4.4 14.1
                    2.5 12
                    4.4 9.9
                    4 7.3
                    6.4 6.2
                    7.3 3.8
                    9.9 4
                    Z
                  "
                ></path>

                <path
                  class="settings-verified-check"
                  d="M8.3 12.1l2.3 2.3 5.2-5.2"
                ></path>

              </svg>

            </span>

          </span>



          <!-- ID + LEVEL -->

          <span class="settings-profile-meta">

            <span id="settingsProfileId">
              User ID
            </span>

            <span class="settings-profile-divider">
              •
            </span>

            <span id="settingsProfileLevel">
              Level 1
            </span>

          </span>



          <!-- ROLE -->

          <span
            id="settingsRoleBadge"
            class="settings-role-badge"
          >
            MASTER
          </span>



          <!-- MOTTO -->

          <span
            id="settingsProfileMotto"
            class="settings-profile-motto"
          >
            “Motto atau kutipan”
          </span>


        </span>



        <!-- PROFILE ARROW -->

        <span
          class="settings-card-arrow settings-profile-arrow"
          aria-hidden="true"
        >

          <svg viewBox="0 0 24 24">

            <path d="M9 18l6-6-6-6"></path>

          </svg>

        </span>


      </button>



      <!-- =================================================
           ADMINISTRATION
           ================================================= -->

      <section
        id="settingsAdministrationSection"
        class="settings-section"
      >

        <div class="settings-section-heading">

          <span class="settings-section-accent"></span>

          <h2>
            ADMINISTRATION
          </h2>

        </div>



        <!-- USER MANAGEMENT -->

        <button
          type="button"
          class="settings-menu-card"
          data-settings-page="user-management"
        >


          <span class="settings-menu-icon user-management-icon">

            <svg viewBox="0 0 24 24">

              <circle
                cx="9"
                cy="8"
                r="3"
              ></circle>

              <circle
                cx="17"
                cy="9"
                r="2.5"
              ></circle>

              <path
                d="M3 20a6 6 0 0 1 12 0"
              ></path>

              <path
                d="M14 15a5 5 0 0 1 7 5"
              ></path>

            </svg>

          </span>



          <span class="settings-menu-content">

            <strong>
              User Management
            </strong>

            <small>
              Manage users, accounts and user levels
            </small>

          </span>



          <span
            class="settings-card-arrow"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">

              <path d="M9 18l6-6-6-6"></path>

            </svg>

          </span>


        </button>



        <!-- ACCESS SETTINGS -->

        <button
          type="button"
          class="settings-menu-card"
          data-settings-page="access-settings"
        >


          <span class="settings-menu-icon access-settings-icon">

            <svg viewBox="0 0 24 24">

              <path
                d="
                  M12 3
                  19 6
                  V11
                  C19 16
                  16 19
                  12 21
                  C8 19
                  5 16
                  5 11
                  V6
                  Z
                "
              ></path>

              <path
                d="M9 12l2 2 4-4"
              ></path>

            </svg>

          </span>



          <span class="settings-menu-content">

            <strong>
              Access Settings
            </strong>

            <small>
              Manage application access &amp; permissions
            </small>

          </span>



          <span
            class="settings-card-arrow"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">

              <path d="M9 18l6-6-6-6"></path>

            </svg>

          </span>


        </button>


      </section>



      <!-- =================================================
           SYSTEM
           ================================================= -->

      <section
        id="settingsSystemSection"
        class="settings-section"
      >

        <div class="settings-section-heading">

          <span class="settings-section-accent"></span>

          <h2>
            SYSTEM
          </h2>

        </div>



        <!-- SYSTEM SETTINGS -->

        <button
          type="button"
          class="settings-menu-card"
          data-settings-page="system-settings"
        >


          <span class="settings-menu-icon system-settings-icon">

            <svg viewBox="0 0 24 24">

              <circle
                cx="12"
                cy="12"
                r="3"
              ></circle>

              <path
                d="
                  M19.4 15
                  A1.7 1.7 0 0 0 19.7 16.9
                  L19.8 17
                  A2 2 0 1 1 17 19.8
                  L16.9 19.7
                  A1.7 1.7 0 0 0 15 19.4
                  A1.7 1.7 0 0 0 14 20
                  A1.7 1.7 0 0 0 13.6 21.1
                  V21.2
                  A2 2 0 1 1 9.6 21.2
                  V21.1
                  A1.7 1.7 0 0 0 8.6 19.4
                  A1.7 1.7 0 0 0 6.7 19.7
                  L6.6 19.8
                  A2 2 0 1 1 3.8 17
                  L3.9 16.9
                  A1.7 1.7 0 0 0 4.6 15
                  A1.7 1.7 0 0 0 4 14
                  A1.7 1.7 0 0 0 2.9 13.6
                  H2.8
                  A2 2 0 1 1 2.8 9.6
                  H2.9
                  A1.7 1.7 0 0 0 4.6 8.6
                  A1.7 1.7 0 0 0 4.3 6.7
                  L4.2 6.6
                  A2 2 0 1 1 7 3.8
                  L7.1 3.9
                  A1.7 1.7 0 0 0 9 4.6
                  A1.7 1.7 0 0 0 10 4
                  A1.7 1.7 0 0 0 10.4 2.9
                  V2.8
                  A2 2 0 1 1 14.4 2.8
                  V2.9
                  A1.7 1.7 0 0 0 15.4 4.6
                  A1.7 1.7 0 0 0 17.3 4.3
                  L17.4 4.2
                  A2 2 0 1 1 20.2 7
                  L20.1 7.1
                  A1.7 1.7 0 0 0 19.4 9
                  A1.7 1.7 0 0 0 20 10
                  A1.7 1.7 0 0 0 21.1 10.4
                  H21.2
                  A2 2 0 1 1 21.2 14.4
                  H21.1
                  A1.7 1.7 0 0 0 19.4 15
                  Z
                "
              ></path>

            </svg>

          </span>



          <span class="settings-menu-content">

            <strong>
              System Settings
            </strong>

            <small>
              Master data &amp; application configuration
            </small>

          </span>



          <span
            class="settings-card-arrow"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">

              <path d="M9 18l6-6-6-6"></path>

            </svg>

          </span>


        </button>


      </section>



      <!-- =================================================
           LOGOUT
           ================================================= -->

      <section class="settings-logout-section">

        <button
          type="button"
          id="settingsLogoutButton"
          class="settings-logout-card"
        >


          <span class="settings-menu-icon logout-icon">

            <svg viewBox="0 0 24 24">

              <path
                d="M10 17l5-5-5-5"
              ></path>

              <path
                d="M15 12H3"
              ></path>

              <path
                d="
                  M14 3
                  H19
                  A2 2 0 0 1 21 5
                  V19
                  A2 2 0 0 1 19 21
                  H14
                "
              ></path>

            </svg>

          </span>



          <span class="settings-menu-content">

            <strong>
              Logout
            </strong>

            <small>
              Sign out from HEXA
            </small>

          </span>



          <span
            class="settings-card-arrow logout-arrow"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">

              <path d="M9 18l6-6-6-6"></path>

            </svg>

          </span>


        </button>

      </section>


    </section>

  </main>



  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="hexa-menu.js"></script>

  <script src="hexa-header.js"></script>

  <script src="settings.js"></script>


</body>

</html>
