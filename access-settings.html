<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access Settings | HEXA</title><link rel="stylesheet" href="hexa-header.css"><link rel="stylesheet" href="access-settings.css"></head>
<body><header id="hexaHeader" data-header-type="standard" data-page="settings" data-active-nav="settings"></header>
<main class="access-page"><div class="access-heading"><a href="settings.html" class="back">← Settings</a><div><h1>Access Settings</h1><p>Pengaturan izin menu dan fitur berdasarkan level pengguna</p></div><span class="master-pill">MASTER ONLY</span></div>
<div id="accessNotice" class="notice" role="status">Memeriksa akses...</div>
<section id="accessWorkspace" hidden><div class="toolbar"><label>Level pengguna<select id="accessRole"></select></label><label>Cari menu atau submenu<input id="accessSearch" placeholder="Cari fitur..."></label><button id="accessReload" type="button">Refresh daftar</button></div><div class="content"><aside id="accessTree" class="tree"></aside><article class="editor"><h2 id="accessTitle">Pilih menu</h2><p id="accessPath" class="muted"></p><div class="mode"><label><input type="radio" name="accessMode" value="default" checked> Default (aturan asli)</label><label><input type="radio" name="accessMode" value="custom"> Custom</label></div><p class="muted" id="accessDescription"></p><div id="accessPermissions" class="permissions"></div><div class="actions"><button type="button" id="accessReset">Reset to Default</button><button type="button" id="accessSave" class="primary">Save Permissions</button></div><p class="muted">Izin yang dikunci tidak dapat diberikan melalui Access Settings. Pengaturan efektif tetap mengikuti batas izin asli fitur.</p></article></div></section></main>
<script src="hexa-menu.js"></script><script src="hexa-header.js"></script><script src="access-registry.js"></script><script src="access-settings.js"></script></body></html>
