<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Greasing Anti Lineboring | HEXA</title>
  <link rel="stylesheet" href="hexa-header.css">
  <link rel="stylesheet" href="greasing-anti-lineboring.css">
</head>
<body>
  <header id="hexaHeader" data-header-type="standard" data-page="daily-maintenance"></header>
  <main class="gal-main">
    <div class="gal-container">
      <div class="gal-top">
        <button id="galBack" class="gal-back" type="button" aria-label="Kembali">‹</button>
        <div class="gal-heading"><div class="gal-title-row"><h1>GREASING ANTI LINEBORING</h1><span id="galSync" class="gal-sync is-loading" role="status" aria-label="Sedang menyinkronkan data" title="Sedang menyinkronkan data"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="gal-sync-refresh" d="M20 7v5h-5M4 17v-5h5M5.6 9A7 7 0 0 1 18 6l2 1M4 17l2 1a7 7 0 0 0 12.4-3"/><path class="gal-sync-check" d="m5 12 4 4L19 6"/><path class="gal-sync-error" d="M12 7v6m0 4h.01"/></svg></span></div><p>Autolube Problem & Follow Up Monitoring</p></div>
      </div>
      <section class="gal-stats" aria-label="Ringkasan">
        <div class="gal-stat"><span>Total Problem</span><strong id="galTotal">0</strong></div>
        <div class="gal-stat"><span>Open</span><strong id="galOpen">0</strong></div>
        <div class="gal-stat"><span>Close</span><strong id="galClose">0</strong></div>
      </section>
      <section class="gal-board">
        <div class="gal-toolbar">
          <h2>Problem List</h2>
          <button type="button" id="galNew" class="gal-primary">+ New Problem</button>
        </div>
        <div class="gal-filters">
          <input id="galSearch" type="search" placeholder="Cari code unit / problem / part..." aria-label="Cari problem">
          <select id="galStatus" aria-label="Filter status"><option value="ALL">Semua Status</option><option value="OPEN">OPEN</option><option value="CLOSE">CLOSE</option></select>
        </div>
        <div id="galCards" class="gal-cards"></div>
      </section>
    </div>
  </main>
  <dialog id="galNewDialog" class="gal-dialog">
    <form id="galNewForm" class="gal-form">
      <div class="gal-dialog-head"><h2>New Autolube Problem</h2><button type="button" data-dismiss="galNewDialog" aria-label="Tutup">✕</button></div>
      <div class="gal-unit-field">
        <label for="galUnitSearch">UNIT CODE <span>*</span></label>
        <div class="gal-unit-combobox" id="galUnitCombobox">
          <input id="galUnitSearch" type="text" placeholder="Search / Select Unit" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="galUnitOptions" aria-autocomplete="list" required>
          <input id="galUnit" type="hidden" value="">
          <div id="galUnitOptions" class="gal-unit-options" role="listbox" hidden></div>
        </div>
      </div>
      <label>Problem Autolube <span>*</span><textarea id="galProblem" required rows="3" placeholder="Jelaskan kerusakan / deviasi"></textarea></label>
      <label>Foto Kerusakan <span>*</span><input id="galDamage" type="file" accept="image/*" required><small>Bisa pilih kamera atau galeri (sesuai perangkat).</small></label>
      <label>Required Part<input id="galPart" placeholder="Nama / nomor part jika diperlukan"></label>
      <label>Recommended Follow Up <span>*</span><textarea id="galRecommendation" required rows="3" placeholder="Rekomendasi tindakan"></textarea></label>
      <p class="gal-message" id="galNewMessage" role="status"></p>
      <div class="gal-form-actions"><button type="button" class="gal-secondary" data-dismiss="galNewDialog">Cancel</button><button type="submit" class="gal-primary" id="galSaveNew">Save Problem</button></div>
    </form>
  </dialog>
  <dialog id="galFollowDialog" class="gal-dialog">
    <form id="galFollowForm" class="gal-form">
      <div class="gal-dialog-head"><h2>Input Follow Up</h2><button type="button" data-dismiss="galFollowDialog" aria-label="Tutup">✕</button></div>
      <p id="galFollowUnit" class="gal-follow-unit"></p>
      <label>Action Follow Up <span>*</span><textarea id="galAction" required rows="3" placeholder="Tindakan yang sudah dilakukan"></textarea></label>
      <label>Final Result <span>*</span><select id="galResult" required><option value="">Pilih hasil</option><option value="NORMAL">NORMAL</option><option value="PARTIAL">PARTIAL - Belum optimal</option><option value="ABNORMAL">ABNORMAL - Masih bermasalah</option></select></label>
      <label>Evidence Foto <span>*</span><input id="galEvidence" type="file" accept="image/*" required><small>Foto hasil pekerjaan / pengujian.</small></label>
      <p class="gal-hint">NORMAL akan menutup problem. PARTIAL / ABNORMAL tetap OPEN dan riwayat tindakan tersimpan.</p>
      <p class="gal-message" id="galFollowMessage" role="status"></p>
      <div class="gal-form-actions"><button type="button" class="gal-secondary" data-dismiss="galFollowDialog">Cancel</button><button type="submit" class="gal-primary" id="galSaveFollow">Save Follow Up</button></div>
    </form>
  </dialog>
  <dialog id="galLightbox" class="gal-lightbox"><button type="button" id="galLightboxClose">Tutup ✕</button><img id="galLightboxImage" alt="Foto diperbesar"></dialog>
  <script src="hexa-menu.js"></script>
  <script src="hexa-header.js"></script>
  <script src="greasing-anti-lineboring.js"></script>
</body>
</html>
