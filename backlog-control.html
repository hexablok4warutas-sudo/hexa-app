<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backlog Control | HEXA</title><link rel="stylesheet" href="hexa-header.css"><link rel="stylesheet" href="backlog-control.css"></head><body><header id="hexaHeader" data-header-type="standard" data-page="backlog-monitoring"></header><main class="bc-main"><div class="bc-shell"><div class="bc-heading"><button id="bcBack" type="button" onclick="window.location.href='./backlog-monitoring.html'" class="bc-back" title="Kembali" aria-label="Kembali">‹</button><div><h1>Backlog Control</h1><p>Monitoring backlog & spare parts</p></div></div><div class="bc-stats" id="bcStats"></div><section class="bc-panel"><div class="bc-toolbar"><span id="bcCount">Memuat data...</span><div class="bc-tools"><button id="bcSearchBtn" title="Search" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg></button><button id="bcFilterBtn" title="Filter" aria-label="Filter"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button><button id="bcColumnsBtn" title="Customize Columns" aria-label="Customize Columns"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg></button><button id="bcUploadBtn" class="bc-upload" title="Upload Excel" aria-label="Upload Excel" hidden><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4h16v-4"/></svg></button></div></div><div id="bcSearchPanel" class="bc-expand" hidden><input id="bcSearch" type="search" placeholder="Cari unit, part, WO, deskripsi..."></div><div id="bcFilterPanel" class="bc-expand bc-filters" hidden><label>Status Part<select id="bcPartFilter"><option value="">Semua</option></select></label><label>Status WO<select id="bcWoFilter"><option value="">Semua</option></select></label><label>Unit<select id="bcUnitFilter"><option value="">Semua</option></select></label><button id="bcResetFilter">Reset Filter</button></div><div id="bcColumnsPanel" class="bc-expand" hidden><div class="bc-inline"><b>Customize Columns</b><button id="bcResetColumns">Default</button></div><div id="bcColumnChoices" class="bc-choices"></div></div><div class="bc-scroll"><table class="bc-table"><thead id="bcThead"></thead><tbody id="bcTbody"></tbody></table></div><div class="bc-pagination"><button id="bcPrev">‹ Previous</button><span id="bcPage"></span><button id="bcNext">Next ›</button></div></section><div class="bc-foot" id="bcUpdated"></div></div></main><dialog id="bcDetail" class="bc-dialog"><div class="bc-dialog-head"><h2>Backlog Detail</h2><button data-close="bcDetail">✕</button></div><div id="bcDetailBody" class="bc-detail-grid"></div></dialog><dialog id="bcUploadDialog" class="bc-dialog bc-wide"><div class="bc-dialog-head"><h2>Upload Backlog Excel</h2><button data-close="bcUploadDialog">✕</button></div><p>Upload hanya untuk Admin, Group Leader, dan Section Head. Data aktif diganti setelah proses upload berhasil. Sinkronisasi DM DATABASE memerlukan konfirmasi terpisah.</p><input id="bcFile" type="file" accept=".xlsx,.xls"><p id="bcUploadStatus" class="bc-status"></p><div id="bcPreview"></div><div class="bc-actions"><button id="bcCommit" disabled>Replace Data</button><button id="bcSync" disabled>Konfirmasi Sync Status Part</button></div></dialog><script src="hexa-menu.js"></script><script src="hexa-header.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="backlog-control.js"></script></body></html>
