<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Daily Outstanding | HEXA</title>


  <!-- GLOBAL HEADER -->
  <link
    rel="stylesheet"
    href="hexa-header.css"
  >


  <!-- DAILY OUTSTANDING -->
  <link
    rel="stylesheet"
    href="daily-outstanding.css"
  >

</head>


<body>


  <!-- ==================================================
       GLOBAL HEADER
       ================================================== -->

  <header
    id="hexaHeader"
    data-header-type="standard"
    data-page="daily-outstanding"
    data-active-nav="daily-maintenance"
  ></header>



  <!-- ==================================================
       DAILY OUTSTANDING PAGE
       ================================================== -->

  <main class="outstanding-page">


    <section class="outstanding-container">


      <!-- ==============================================
           FIXED / STICKY PAGE TITLE
           ============================================== -->

      <div class="outstanding-title-bar">


        <div class="outstanding-title">

          <img
            src="hexa-icon-page-dailyoutstanding.svg"
            alt="Daily Outstanding"
          >

          <h1>
            Daily Outstanding
          </h1>

        </div>


        <!-- FILTER BUTTON -->

        <button
          type="button"
          id="filterButton"
          class="filter-button"
          aria-label="Filter Daily Outstanding"
          aria-expanded="false"
        >

          <svg viewBox="0 0 24 24">

            <path
              d="M4 5h16L14 12v5l-4 2v-7L4 5z"
            ></path>

          </svg>

        </button>


      </div>



      <!-- ==============================================
           FILTER PANEL
           ============================================== -->

      <div
        id="filterPanel"
        class="filter-panel"
        hidden
      >


        <div class="filter-panel-header">

          <h2>
            Filter Outstanding
          </h2>

          <button
            type="button"
            id="closeFilterButton"
            class="filter-close-button"
            aria-label="Close Filter"
          >
            ×
          </button>

        </div>



        <div class="filter-grid">


          <!-- UNIT CODE -->

          <div class="filter-group">

            <label for="filterUnitCode">
              Unit Code
            </label>

            <select id="filterUnitCode">

              <option value="">
                All Unit
              </option>

            </select>

          </div>



          <!-- PROBLEM -->

          <div class="filter-group">

            <label for="filterProblem">
              Problem Description
            </label>

            <input
              type="text"
              id="filterProblem"
              placeholder="Search problem..."
            >

          </div>



          <!-- DATE -->

          <div class="filter-group">

            <label for="filterDate">
              Date Inspection
            </label>

            <input
              type="date"
              id="filterDate"
            >

          </div>



          <!-- MOL -->

          <div class="filter-group">

            <label for="filterMol">
              MOL
            </label>

            <select id="filterMol">

              <option value="">
                All MOL
              </option>

              <option value="Belum">
                Belum
              </option>

              <option value="Submitted">
                Submitted
              </option>

            </select>

          </div>


        </div>



        <div class="filter-actions">


          <button
            type="button"
            id="resetFilterButton"
            class="filter-reset-button"
          >
            Reset
          </button>


          <button
            type="button"
            id="applyFilterButton"
            class="filter-apply-button"
          >
            Apply Filter
          </button>


        </div>


      </div>



      <!-- ==============================================
           OUTSTANDING LIST
           ============================================== -->

      <section class="outstanding-list-section">


        <!-- LOADING -->

        <div
          id="outstandingLoading"
          class="outstanding-state"
        >

          Loading Outstanding...

        </div>



        <!-- EMPTY -->

        <div
          id="outstandingEmpty"
          class="outstanding-state"
          hidden
        >

          Tidak ada Daily Outstanding.

        </div>



        <!-- ERROR -->

        <div
          id="outstandingError"
          class="outstanding-state error"
          hidden
        >

          Data Daily Outstanding gagal dimuat.

        </div>



        <!-- LIST SCROLL CONTAINER -->

        <div
          id="outstandingScrollContainer"
          class="outstanding-scroll-container"
          hidden
        >


          <div
            id="outstandingList"
            class="outstanding-list"
          ></div>


        </div>



        <!-- SCROLL NAVIGATION -->

        <div
          id="scrollNavigation"
          class="scroll-navigation"
          hidden
        >


          <button
            type="button"
            id="scrollUpButton"
            class="scroll-nav-button"
            aria-label="Scroll Up"
          >
            ▲
          </button>


          <button
            type="button"
            id="scrollDownButton"
            class="scroll-nav-button"
            aria-label="Scroll Down"
          >
            ▼
          </button>


        </div>


      </section>


    </section>


  </main>



  <!-- ==================================================
       DETAIL MODAL
       ================================================== -->

  <div
    id="detailModal"
    class="modal-overlay"
    hidden
  >


    <section
      class="detail-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detailUnitCode"
    >


      <!-- DETAIL PHOTO -->

      <button
        type="button"
        id="detailPhotoButton"
        class="detail-photo-button"
        aria-label="View Inspection Photo"
      >

        <img
          id="detailPhoto"
          src=""
          alt="Inspection Photo"
        >

      </button>



      <!-- UNIT CODE -->

      <h2 id="detailUnitCode">
        -
      </h2>



      <!-- DETAIL INFORMATION -->

      <div class="detail-information">


        <div class="detail-row">

          <span class="detail-label">
            HM Inspection
          </span>

          <span class="detail-separator">
            :
          </span>

          <span
            id="detailHmInspection"
            class="detail-value"
          >
            -
          </span>

        </div>



        <div class="detail-row">

          <span class="detail-label">
            Date Inspection
          </span>

          <span class="detail-separator">
            :
          </span>

          <span
            id="detailDateInspection"
            class="detail-value"
          >
            -
          </span>

        </div>



        <div class="detail-row">

          <span class="detail-label">
            Group Component
          </span>

          <span class="detail-separator">
            :
          </span>

          <span
            id="detailGroupComponent"
            class="detail-value"
          >
            -
          </span>

        </div>



        <div class="detail-row">

          <span class="detail-label">
            Problem Description
          </span>

          <span class="detail-separator">
            :
          </span>

          <span
            id="detailProblemDescription"
            class="detail-value"
          >
            -
          </span>

        </div>



        <div class="detail-row">

          <span class="detail-label">
            Rating
          </span>

          <span class="detail-separator">
            :
          </span>

          <span
            id="detailRating"
            class="detail-value"
          >
            -
          </span>

        </div>



        <div class="detail-row">

          <span class="detail-label">
            Parts Description
          </span>

          <span class="detail-separator">
            :
          </span>

          <span
            id="detailPartsDescription"
            class="detail-value"
          >
            -
          </span>

        </div>



        <div class="detail-row">

          <span class="detail-label">
            MOL
          </span>

          <span class="detail-separator">
            :
          </span>

          <span
            id="detailMol"
            class="detail-value"
          >
            -
          </span>

        </div>



        <div class="detail-row">

          <span class="detail-label">
            Parts Status
          </span>

          <span class="detail-separator">
            :
          </span>

          <span
            id="detailPartsStatus"
            class="detail-value"
          >
            -
          </span>

        </div>


      </div>



      <!-- DETAIL ACTION -->

      <div class="detail-actions">


        <button
          type="button"
          id="editOutstandingButton"
          class="detail-action-button edit"
          aria-label="Edit Outstanding"
        >

          <svg viewBox="0 0 24 24">

            <path
              d="M4 20h4L19 9l-4-4L4 16v4z"
            ></path>

            <path
              d="M13.5 6.5l4 4"
            ></path>

          </svg>

        </button>



        <button
          type="button"
          id="closeDetailButton"
          class="detail-action-button close"
          aria-label="Close Detail"
        >

          <svg viewBox="0 0 24 24">

            <path d="M6 6l12 12"></path>

            <path d="M18 6L6 18"></path>

          </svg>

        </button>


      </div>


    </section>


  </div>



  <!-- ==================================================
       FULLSCREEN PHOTO VIEWER
       ================================================== -->

  <div
    id="photoViewer"
    class="photo-viewer"
    hidden
  >


    <div class="photo-viewer-toolbar">


      <button
        type="button"
        id="zoomOutButton"
        class="photo-tool-button"
        aria-label="Zoom Out"
      >
        −
      </button>


      <button
        type="button"
        id="resetZoomButton"
        class="photo-tool-button"
        aria-label="Reset Zoom"
      >
        100%
      </button>


      <button
        type="button"
        id="zoomInButton"
        class="photo-tool-button"
        aria-label="Zoom In"
      >
        +
      </button>


      <button
        type="button"
        id="closePhotoViewerButton"
        class="photo-tool-button close"
        aria-label="Close Photo"
      >
        ×
      </button>


    </div>



    <div class="photo-viewer-stage">

      <img
        id="photoViewerImage"
        src=""
        alt="Inspection Photo Fullscreen"
      >

    </div>


  </div>



  <!-- ==================================================
       UPDATE OUTSTANDING MODAL
       ================================================== -->

  <div
    id="updateModal"
    class="modal-overlay update-overlay"
    hidden
  >


    <section
      class="update-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="updateFormTitle"
    >


      <!-- UPDATE TITLE -->

      <div class="update-title">

        <h2 id="updateFormTitle">
          Updates Form
        </h2>

      </div>



      <!-- UPDATE FORM -->

      <form
        id="updateOutstandingForm"
        class="update-form"
      >


        <!-- INTERNAL ID -->

        <input
          type="hidden"
          id="updateInspectionId"
        >



        <!-- UNIT CODE -->

        <div class="form-group">

          <label for="updateUnitCode">
            UNIT CODE <span>*</span>
          </label>

          <select
            id="updateUnitCode"
            required
          >

            <option value="">
              Select Unit
            </option>

          </select>

        </div>



        <!-- HM INSPECTION -->

        <div class="form-group">

          <label for="updateHmInspection">
            HM Inspection <span>*</span>
          </label>


          <div class="number-control">


            <button
              type="button"
              id="updateHmMinus"
              class="number-button"
            >
              −
            </button>


            <input
              type="number"
              id="updateHmInspection"
              min="0"
              step="1"
              required
            >


            <button
              type="button"
              id="updateHmPlus"
              class="number-button"
            >
              +
            </button>


          </div>

        </div>



        <!-- DATE INSPECTION -->

        <div class="form-group">

          <label for="updateDateInspection">
            Date Inspection
          </label>

          <input
            type="date"
            id="updateDateInspection"
          >

        </div>



        <!-- INSPECTION PHOTO -->

        <div class="form-group">

          <label>
            Photo <span>*</span>
          </label>


          <div class="existing-photo">

            <img
              id="updateInspectionPhotoPreview"
              src=""
              alt="Inspection Photo"
            >

          </div>


          <label
            class="file-upload-button"
            for="updateInspectionPhoto"
          >

            Retake / Replace Photo

          </label>


          <input
            type="file"
            id="updateInspectionPhoto"
            accept="image/*"
            capture="environment"
            hidden
          >

        </div>



        <!-- GROUP COMPONENT -->

        <div class="form-group">

          <label for="updateGroupComponent">
            Group Component <span>*</span>
          </label>

          <select
            id="updateGroupComponent"
            required
          >

            <option value="">
              Select Component
            </option>

            <option value="ENGINE">
              ENGINE
            </option>

            <option value="TRANSMISSION">
              TRANSMISSION
            </option>

            <option value="HYDRAULIC SYSTEM">
              HYDRAULIC SYSTEM
            </option>

            <option value="SWING & TRAVEL">
              SWING &amp; TRAVEL
            </option>

            <option value="FINAL DRIVE">
              FINAL DRIVE
            </option>

            <option value="UNDER CARRIAGE">
              UNDER CARRIAGE
            </option>

          </select>

        </div>



        <!-- PROBLEM DESCRIPTION -->

        <div class="form-group">

          <label for="updateProblemDescription">
            Problem Description <span>*</span>
          </label>

          <textarea
            id="updateProblemDescription"
            rows="3"
            required
          ></textarea>

        </div>



        <!-- RATING -->

        <div class="form-group">

          <label>
            Rating <span>*</span>
          </label>


          <div
            id="updateRatingGrid"
            class="rating-grid"
          >

            <button
              type="button"
              class="rating-button"
              data-rating="RATE A"
            >
              RATE A
            </button>

            <button
              type="button"
              class="rating-button"
              data-rating="RATE B"
            >
              RATE B
            </button>

            <button
              type="button"
              class="rating-button"
              data-rating="RATE C"
            >
              RATE C
            </button>

            <button
              type="button"
              class="rating-button"
              data-rating="RATE X"
            >
              RATE X
            </button>

          </div>


          <input
            type="hidden"
            id="updateRating"
            required
          >

        </div>



        <!-- PARTS DESCRIPTION -->

        <div class="form-group">

          <label for="updatePartsDescription">
            Parts Description
          </label>

          <input
            type="text"
            id="updatePartsDescription"
          >

        </div>



        <!-- PART NO -->

        <div class="form-group">

          <label for="updatePartNo">
            Part No
          </label>

          <input
            type="text"
            id="updatePartNo"
          >

        </div>



        <!-- QUANTITY -->

        <div class="form-group">

          <label for="updateQuantity">
            Quantity
          </label>

          <input
            type="number"
            id="updateQuantity"
            min="0"
          >

        </div>



        <!-- NOTES -->

        <div class="form-group">

          <label for="updateNotes">
            Notes
          </label>

          <textarea
            id="updateNotes"
            rows="3"
          ></textarea>

        </div>



        <!-- MOL READ ONLY -->

        <div class="form-group">

          <label for="updateMol">
            MOL
          </label>

          <input
            type="text"
            id="updateMol"
            readonly
          >

        </div>



        <!-- EVIDENCE -->

        <div class="form-group">

          <label for="updateEvidence">
            Evidence
          </label>


          <label
            class="evidence-upload"
            for="updateEvidence"
          >

            <svg viewBox="0 0 24 24">

              <path
                d="M9 4l1.5-2h3L15 4h4a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h4z"
              ></path>

              <circle
                cx="12"
                cy="12"
                r="4"
              ></circle>

            </svg>


            <span id="evidenceFileText">
              Upload Photo / PDF
            </span>

          </label>


          <input
            type="file"
            id="updateEvidence"
            accept="image/*,.pdf,application/pdf"
            hidden
          >


          <div
            id="existingEvidence"
            class="existing-evidence"
            hidden
          ></div>

        </div>



        <!-- PARTS STATUS -->

        <div class="form-group">

          <label>
            Parts Status
          </label>


          <div
            id="partsStatusGrid"
            class="parts-status-grid"
          >

            <button
              type="button"
              class="parts-status-button"
              data-status="Not Process"
            >
              Not Process
            </button>


            <button
              type="button"
              class="parts-status-button"
              data-status="Waiting Parts"
            >
              Waiting Parts
            </button>


            <button
              type="button"
              class="parts-status-button"
              data-status="Ready"
            >
              Ready
            </button>


            <button
              type="button"
              class="parts-status-button"
              data-status="Supply"
            >
              Supply
            </button>

          </div>


          <input
            type="hidden"
            id="updatePartsStatus"
          >

        </div>



        <!-- STATUS READ ONLY -->

        <div class="form-group">

          <label for="updateStatus">
            Status
          </label>

          <input
            type="text"
            id="updateStatus"
            readonly
          >

        </div>



        <!-- ACTION PROBLEMS -->

        <div class="form-group">

          <label for="updateActionProblems">
            Action Problems
          </label>

          <textarea
            id="updateActionProblems"
            rows="3"
          ></textarea>

        </div>



        <!-- HM ACTION -->

        <div class="form-group">

          <label for="updateHmAction">
            HM Action
          </label>


          <div class="number-control">


            <button
              type="button"
              id="updateHmActionMinus"
              class="number-button"
            >
              −
            </button>


            <input
              type="number"
              id="updateHmAction"
              min="0"
              step="1"
              value="0"
            >


            <button
              type="button"
              id="updateHmActionPlus"
              class="number-button"
            >
              +
            </button>


          </div>

        </div>



        <!-- DATE ACTION -->

        <div class="form-group">

          <label for="updateDateAction">
            Date Action
          </label>

          <input
            type="date"
            id="updateDateAction"
          >

        </div>



        <!-- MAN POWER -->

        <div class="form-group">

          <label for="updateManPower">
            Man Power
          </label>

          <input
            type="text"
            id="updateManPower"
          >

        </div>



        <!-- UPDATE ACTIONS -->

        <div class="update-form-actions">


          <button
            type="button"
            id="cancelUpdateButton"
            class="cancel-update-button"
          >
            Cancel
          </button>


          <button
            type="submit"
            id="submitUpdateButton"
            class="submit-update-button"
          >
            Update
          </button>


        </div>


      </form>


    </section>


  </div>



  <!-- ==================================================
       START INSPECTION SHORTCUT
       ================================================== -->

  <button
    type="button"
    id="startInspectionShortcut"
    class="start-inspection-shortcut"
    aria-label="Start Inspection"
  >

    <span></span>

  </button>



  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="hexa-menu.js"></script>

  <script src="hexa-header.js"></script>

  <script src="daily-outstanding.js"></script>


</body>

</html>
