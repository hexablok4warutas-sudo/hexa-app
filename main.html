<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HEXA</title>

  <!-- CSS MAIN PAGE -->
  <link
    rel="stylesheet"
    href="main.css"
  >
</head>

<body>

  <!-- =====================================
       HEADER
       ===================================== -->
  <header class="main-header">

    <!-- LOGO HEXA -->
    <div class="header-logo">
      <img
        src="hexa-logo-header.png"
        alt="HEXA"
      >
    </div>


    <!-- HEADER ACTION -->
    <div class="header-actions">

      <!-- SEARCH -->
      <div class="search-box">

        <input
          type="text"
          id="searchInput"
          placeholder=""
          autocomplete="off"
        >

        <button
          type="button"
          id="searchButton"
          class="search-button"
          aria-label="Search"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="11"
              cy="11"
              r="7"
            ></circle>

            <line
              x1="16.5"
              y1="16.5"
              x2="21"
              y2="21"
            ></line>
          </svg>
        </button>

      </div>


      <!-- REFRESH -->
      <button
        type="button"
        id="refreshButton"
        class="refresh-button"
        aria-label="Refresh"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M20 6v5h-5"
          ></path>

          <path
            d="M18.5 15a7 7 0 1 1 .2-6"
          ></path>
        </svg>
      </button>

    </div>

  </header>


  <!-- =====================================
       MAIN CONTENT
       ===================================== -->
  <main class="main-content">


    <!-- ===================================
         BANNER / SLIDER
         =================================== -->
    <section class="banner-section">

      <div
        class="banner-slider"
        id="bannerSlider"
      >

        <!-- BANNER 1 -->
        <div class="banner-slide active">

          <img
            src="banner-01.jpg"
            alt="HEXA Banner 1"
          >

        </div>


        <!-- BANNER 2 -->
        <div class="banner-slide">

          <img
            src="banner-02.jpg"
            alt="HEXA Banner 2"
          >

        </div>


        <!-- PREVIOUS -->
        <button
          type="button"
          class="slider-button slider-prev"
          id="sliderPrev"
          aria-label="Previous banner"
        >
          &#8592;
        </button>


        <!-- NEXT -->
        <button
          type="button"
          class="slider-button slider-next"
          id="sliderNext"
          aria-label="Next banner"
        >
          &#8594;
        </button>

      </div>

    </section>


    <!-- ===================================
         MENU AREA
         =================================== -->
    <section class="menu-section">

      <div
        class="menu-grid"
        id="menuGrid"
      >


        <!-- DAILY MAINTENANCE -->
        <button
          type="button"
          class="menu-item"
          data-menu="daily-maintenance"
        >

          <img
            src="hexa-icon-svg-dailymaintenance.svg"
            alt="Daily Maintenance"
          >

          <span>
            Daily Maintenance
          </span>

        </button>


        <!-- BACKLOG MONITORING -->
        <button
          type="button"
          class="menu-item"
          data-menu="backlog-monitoring"
        >

          <img
            src="hexa-icon-svg-backlogmonitoring.svg"
            alt="Backlog Monitoring"
          >

          <span>
            Backlog Monitoring
          </span>

        </button>


        <!-- FUI -->
        <button
          type="button"
          class="menu-item"
          data-menu="fui"
        >

          <img
            src="hexa-icon-svg-fui.svg"
            alt="FUI"
          >

          <span>
            FUI
          </span>

        </button>


        <!-- ROTABLE -->
        <button
          type="button"
          class="menu-item"
          data-menu="rotable"
        >

          <img
            src="hexa-icon-svg-rotable.svg"
            alt="Rotable"
          >

          <span>
            Rotable
          </span>

        </button>


        <!-- NEWS -->
        <button
          type="button"
          class="menu-item"
          data-menu="news"
        >

          <img
            src="hexa-icon-svg-news.svg"
            alt="News"
          >

          <span>
            News
          </span>

        </button>


        <!-- =================================
             SETTINGS
             HARUS SELALU MENU TERAKHIR
             ================================= -->
        <button
          type="button"
          class="menu-item settings-item"
          data-menu="settings"
          id="settingsMenu"
        >

          <!--
            Untuk sementara icon Settings
            dibuat dengan SVG internal.
            Nanti bisa diganti file SVG.
          -->

          <div class="settings-icon">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 8.5
                   a3.5 3.5 0 1 0 0 7
                   a3.5 3.5 0 1 0 0-7"
              ></path>

              <path
                d="M19.4 15
                   a1.7 1.7 0 0 0 .34 1.88
                   l.06.06
                   a2 2 0 1 1-2.83 2.83
                   l-.06-.06
                   A1.7 1.7 0 0 0 15 19.4
                   a1.7 1.7 0 0 0-1 .6
                   a1.7 1.7 0 0 0-.5 1.2
                   V21.3
                   a2 2 0 1 1-4 0
                   v-.1
                   A1.7 1.7 0 0 0 8 19.4
                   a1.7 1.7 0 0 0-1.88.34
                   l-.06.06
                   a2 2 0 1 1-2.83-2.83
                   l.06-.06
                   A1.7 1.7 0 0 0 3.6 15
                   a1.7 1.7 0 0 0-.6-1
                   a1.7 1.7 0 0 0-1.2-.5
                   H1.7
                   a2 2 0 1 1 0-4
                   h.1
                   A1.7 1.7 0 0 0 3.6 8
                   a1.7 1.7 0 0 0-.34-1.88
                   l-.06-.06
                   a2 2 0 1 1 2.83-2.83
                   l.06.06
                   A1.7 1.7 0 0 0 8 3.6
                   a1.7 1.7 0 0 0 1-.6
                   a1.7 1.7 0 0 0 .5-1.2
                   V1.7
                   a2 2 0 1 1 4 0
                   v.1
                   A1.7 1.7 0 0 0 15 3.6
                   a1.7 1.7 0 0 0 1.88-.34
                   l.06-.06
                   a2 2 0 1 1 2.83 2.83
                   l-.06.06
                   A1.7 1.7 0 0 0 19.4 8
                   a1.7 1.7 0 0 0 .6 1
                   a1.7 1.7 0 0 0 1.2.5
                   h.1
                   a2 2 0 1 1 0 4
                   h-.1
                   A1.7 1.7 0 0 0 19.4 15Z"
              ></path>
            </svg>

          </div>

          <span>
            Settings
          </span>

        </button>

      </div>

    </section>

  </main>


  <!-- =====================================
       FLOATING START INSPECTION
       ===================================== -->

  <button
    type="button"
    id="inspectionShortcut"
    class="inspection-shortcut"
    aria-label="Start Inspection"
    title="Start Inspection"
  >
    <span>+</span>
  </button>


  <!-- =====================================
       JAVASCRIPT MAIN PAGE
       ===================================== -->

  <script src="main.js"></script>

</body>
</html>
