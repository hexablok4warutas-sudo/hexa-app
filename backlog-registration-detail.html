<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail Registrasi Backlog | HEXA</title><link rel="stylesheet" href="hexa-header.css"><link rel="stylesheet" href="backlog-registration-detail.css"></head>
<body><header id="hexaHeader" data-header-type="standard" data-page="backlog-monitoring"></header>
<main class="brd-main"><div class="brd-shell"><div class="brd-heading"><button id="brdBack" type="button">← Kembali</button><div><h1>Detail Registrasi Backlog</h1><p>Informasi registrasi dan pemeriksaan approval per part</p></div></div>
<div id="brdMessage" role="status">Memuat detail registrasi...</div><section id="brdSummary" class="brd-summary" hidden></section><section id="brdApprovalPanel" class="brd-approval-panel" hidden><div class="brd-approval-heading"><h2>Persiapan Approval Part</h2><span id="brdApprovalCount" aria-live="polite">0 part dipilih</span></div><label class="brd-check-label"><input type="checkbox" id="brdApproveAll"> Approve All Registration</label><p id="brdApprovalHelp" class="brd-muted"></p><div class="brd-approval-actions"><button id="brdFinalApprove" type="button" disabled>Final Approve</button><button id="brdRequestRevision" type="button" disabled>Request Revision</button></div><p class="brd-muted">Tombol keputusan akhir belum aktif. Penyimpanan keputusan menunggu API Approval Tahap 2.</p></section><section id="brdItems" class="brd-items"></section></div></main>
<div id="brdLightbox" class="brd-lightbox" hidden><button id="brdLightboxClose" type="button" aria-label="Tutup">×</button><img id="brdLightboxImage" alt="Foto registrasi"></div>
<script src="hexa-menu.js"></script><script src="hexa-header.js"></script><script src="backlog-registration-detail.js"></script></body></html>
