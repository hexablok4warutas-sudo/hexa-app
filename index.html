<body>

  <main class="login-page">

    <!-- =========================
         AREA BACKGROUND DOODLE
         ========================= -->

    <section class="hero-section">

      <img
        src="hexa-logo-login.png"
        alt="HEXA"
        class="hexa-logo"
      >

    </section>

    <!-- =========================
         AREA ORANGE
         ========================= -->

    <section class="orange-section"></section>

    <!-- =========================
         LOGIN AREA
         ========================= -->

    <section class="login-wrapper">

      <div class="login-card">

        <form id="loginForm">

          <!-- USER ID -->
          <div class="input-group">

            <label for="userId">
              User ID
            </label>

            <input
              type="text"
              id="userId"
              name="userId"
              placeholder="Masukkan User ID"
              autocomplete="username"
              required
            >

          </div>

          <!-- PASSWORD -->
          <div class="input-group">

            <label for="password">
              Password
            </label>

            <div class="password-wrapper">

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Masukkan Password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                id="togglePassword"
                class="toggle-password"
                aria-label="Tampilkan password"
              >
                👁
              </button>

            </div>

          </div>

          <!-- LOGIN BUTTON -->
          <button
            type="submit"
            id="loginButton"
            class="login-button"
          >
            Log in
          </button>

          <!-- LOGIN MESSAGE -->
          <p
            id="loginMessage"
            class="login-message"
          ></p>

        </form>

      </div>

      <!-- LOGO HRS -->
      <img
        src="hexa-logo-hrs.png"
        alt="Hasnur Riung Sinergi"
        class="hrs-logo"
      >

    </section>

  </main>

  <!-- =====================================
       HEXA LOGIN JAVASCRIPT
       ===================================== -->

  <script src="app.js"></script>

</body>
