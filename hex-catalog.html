<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEXCatalog | HEXA</title>
  <link rel="stylesheet" href="hexa-header.css">
  <link rel="stylesheet" href="hex-catalog.css">
</head>
<body>
  <header id="hexaHeader" data-header-type="standard" data-page="hex-catalog"></header>
  <main class="hexcatalog-main">
    <div class="hexcatalog-shell">
      <section class="hexcatalog-heading" aria-labelledby="catalog-title">
        <img class="hexcatalog-title-icon" src="hexa-icon-partscatalog.svg" alt="" onerror="this.style.display='none'">
        <h1 id="catalog-title">HEX<span>Catalog</span></h1>
      </section>
      <section class="hexcatalog-container" aria-labelledby="unit-heading">
        <div class="hexcatalog-section-heading">
          <div>
            <div class="hexcatalog-eyebrow">PARTS REFERENCE LIBRARY</div>
            <p>Pilih model unit untuk membuka katalog komponen.</p>
          </div>
        </div>
        <div class="hexcatalog-grid">
          <button type="button" class="catalog-card" data-model="CAT 395" aria-label="Buka katalog CAT 395">
            <span class="catalog-card-visual">
              <img src="cat-395.png" alt="Excavator CAT 395" loading="lazy" onerror="this.classList.add('image-missing')">
              <span class="catalog-card-image-fallback" aria-hidden="true">Foto CAT 395</span>
            </span>
            <span class="catalog-card-info">
              <span class="catalog-card-name">CAT 395</span>
              <span class="catalog-card-maker">Caterpillar</span>
              <span class="catalog-card-action">Open Catalog</span>
            </span>
          </button>
          <button type="button" class="catalog-card" data-model="PC1250-8" aria-label="Buka katalog PC1250-8">
            <span class="catalog-card-visual">
              <img src="pc1250-8.png" alt="Excavator PC1250-8" loading="lazy" onerror="this.classList.add('image-missing')">
              <span class="catalog-card-image-fallback" aria-hidden="true">Foto PC1250-8</span>
            </span>
            <span class="catalog-card-info">
              <span class="catalog-card-name">PC1250-8</span>
              <span class="catalog-card-maker">Komatsu</span>
              <span class="catalog-card-action">Open Catalog</span>
            </span>
          </button>
          <button type="button" class="catalog-card" data-model="PC1250-11" aria-label="Buka katalog PC1250-11">
            <span class="catalog-card-visual">
              <img src="pc1250-11.png" alt="Excavator PC1250-11" loading="lazy" onerror="this.classList.add('image-missing')">
              <span class="catalog-card-image-fallback" aria-hidden="true">Foto PC1250-11</span>
            </span>
            <span class="catalog-card-info">
              <span class="catalog-card-name">PC1250-11</span>
              <span class="catalog-card-maker">Komatsu</span>
              <span class="catalog-card-action">Open Catalog</span>
            </span>
          </button>
          <button type="button" class="catalog-card" data-model="PC500" aria-label="Buka katalog PC500">
            <span class="catalog-card-visual">
              <img src="pc500.png" alt="Excavator PC500" loading="lazy" onerror="this.classList.add('image-missing')">
              <span class="catalog-card-image-fallback" aria-hidden="true">Foto PC500</span>
            </span>
            <span class="catalog-card-info">
              <span class="catalog-card-name">PC500</span>
              <span class="catalog-card-maker">Komatsu</span>
              <span class="catalog-card-action">Open Catalog</span>
            </span>
          </button>
          <button type="button" class="catalog-card" data-model="SANY SY500H" aria-label="Buka katalog SANY SY500H">
            <span class="catalog-card-visual">
              <img src="hexcatalog.sy500h.svg" alt="Excavator SANY SY500H" loading="lazy" onerror="this.classList.add('image-missing')">
              <span class="catalog-card-image-fallback" aria-hidden="true">Foto SANY SY500H</span>
            </span>
            <span class="catalog-card-info">
              <span class="catalog-card-name">SY500H</span>
              <span class="catalog-card-maker">SANY</span>
              <span class="catalog-card-action">Open Catalog</span>
            </span>
          </button>
          <button type="button" class="catalog-card" data-model="D375A-6R" aria-label="Buka katalog D375A-6R">
            <span class="catalog-card-visual"><img src="hexcatalog-d375.svg" alt="Bulldozer Komatsu D375A-6R" loading="lazy" onerror="this.classList.add('image-missing')"><span class="catalog-card-image-fallback" aria-hidden="true">D375A-6R</span></span>
            <span class="catalog-card-info"><span class="catalog-card-name">D375A-6R</span><span class="catalog-card-maker">Komatsu</span><span class="catalog-card-action">Open Catalog</span></span>
          </button>
          <button type="button" class="catalog-card" data-model="D85ESS-2" aria-label="Buka katalog Komatsu D85ESS-2">
            <span class="catalog-card-visual">
              <img src="hexcatalog-d85.svg" alt="Bulldozer Komatsu D85ESS-2" loading="lazy" onerror="this.classList.add('image-missing')">
              <span class="catalog-card-image-fallback" aria-hidden="true">D85ESS-2</span>
            </span>
            <span class="catalog-card-info">
              <span class="catalog-card-name">D85ESS-2</span>
              <span class="catalog-card-maker">Komatsu</span>
              <span class="catalog-card-action">Open Catalog</span>
            </span>
          </button>
        </div>
        <p class="hexcatalog-note">Katalog assembly dan Parts List akan ditambahkan pada tahap berikutnya.</p>
      </section>
    </div>
  </main>
  <script src="hexa-menu.js"></script>
  <script src="hexa-header.js"></script>
  <script src="hex-catalog.js"></script>
  <script src="hex-catalog-pc1250-8-link.js"></script>
  <script src="hex-catalog-pc500-link.js"></script>
</body>
</html>
