<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>System Settings | HEXA</title>

  <link rel="stylesheet" href="hexa-header.css">
  <link rel="stylesheet" href="system-settings.css">

</head>

<body>

  <header
    id="hexaHeader"
    data-header-type="standard"
    data-page="settings"
  ></header>

  <main
    id="systemSettingsPage"
    class="system-settings-page"
  >

    <section class="system-settings-heading-shell">

      <div class="system-settings-heading">

        <button
          type="button"
          id="systemSettingsBackButton"
          class="system-settings-back-button"
          aria-label="Back to Settings"
        >
          <svg viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6"></path>
          </svg>
        </button>

        <span
          class="system-settings-heading-icon"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="
                M19.4 15
                A1.7 1.7 0 0 0 19.7 16.9
                L19.8 17
                A2 2 0 1 1 17 19.8
                L16.9 19.7
                A1.7 1.7 0 0 0 15 19.4
                A1.7 1.7 0 0 0 14 20
                A1.7 1.7 0 0 0 13.6 21.1
                V21.2
                A2 2 0 1 1 9.6 21.2
                V21.1
                A1.7 1.7 0 0 0 8.6 19.4
                A1.7 1.7 0 0 0 6.7 19.7
                L6.6 19.8
                A2 2 0 1 1 3.8 17
                L3.9 16.9
                A1.7 1.7 0 0 0 4.6 15
                A1.7 1.7 0 0 0 4 14
                A1.7 1.7 0 0 0 2.9 13.6
                H2.8
                A2 2 0 1 1 2.8 9.6
                H2.9
                A1.7 1.7 0 0 0 4.6 8.6
                A1.7 1.7 0 0 0 4.3 6.7
                L4.2 6.6
                A2 2 0 1 1 7 3.8
                L7.1 3.9
                A1.7 1.7 0 0 0 9 4.6
                A1.7 1.7 0 0 0 10 4
                A1.7 1.7 0 0 0 10.4 2.9
                V2.8
                A2 2 0 1 1 14.4 2.8
                V2.9
                A1.7 1.7 0 0 0 15.4 4.6
                A1.7 1.7 0 0 0 17.3 4.3
                L17.4 4.2
                A2 2 0 1 1 20.2 7
                L20.1 7.1
                A1.7 1.7 0 0 0 19.4 9
                A1.7 1.7 0 0 0 20 10
                A1.7 1.7 0 0 0 21.1 10.4
                H21.2
                A2 2 0 1 1 21.2 14.4
                H21.1
                A1.7 1.7 0 0 0 19.4 15
                Z
              "
            ></path>
          </svg>
        </span>

        <div class="system-settings-heading-text">
          <h1>System Settings</h1>
          <p>Master Data &amp; Application Configuration</p>
        </div>

      </div>

    </section>

    <section class="system-settings-container">

      <section class="system-settings-section">

        <div class="system-settings-section-heading">
          <span class="system-settings-section-accent"></span>
          <h2>MASTER DATA</h2>
        </div>

        <button
          type="button"
          id="populationUnitCard"
          class="system-settings-menu-card"
          data-system-page="population-unit"
        >
          <span class="system-settings-menu-icon population-unit-icon">
            <svg viewBox="0 0 24 24">
              <path d="M4 15V10L7 6H17L20 10V15"></path>
              <path d="M3 15H21V18H3Z"></path>
              <circle cx="7" cy="18" r="2"></circle>
              <circle cx="17" cy="18" r="2"></circle>
            </svg>
          </span>

          <span class="system-settings-menu-content">
            <strong>Population Unit</strong>
            <small>Manage unit population, EGI and operational status</small>
          </span>

          <span class="system-settings-card-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M9 18l6-6-6-6"></path>
            </svg>
          </span>
        </button>

      </section>

      <!-- DATA MANAGEMENT -->
      <section class="system-settings-section system-settings-section-spaced" id="systemSettingsDataManagement">
        <div class="system-settings-section-heading">
          <span class="system-settings-section-accent"></span>
          <h2>DATA MANAGEMENT</h2>
        </div>
        <button type="button" id="kpiDataManagementCard" class="system-settings-menu-card" data-system-page="kpi-data-management">
          <span class="system-settings-menu-icon kpi-data-management-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="4" y="3" width="16" height="18" rx="2"></rect>
              <path d="M4 9h16M4 15h16M10 9v12M15 9v12"></path>
            </svg>
          </span>
          <span class="system-settings-menu-content">
            <strong>KPI Data Management</strong>
            <small>Manage Daily Maintenance KPI data &amp; Excel reports</small>
          </span>
          <span class="system-settings-card-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
          </span>
        </button>
      </section>

      <section class="system-settings-section system-settings-section-spaced">

        <div class="system-settings-section-heading">
          <span class="system-settings-section-accent"></span>
          <h2>APPLICATION CONFIGURATION</h2>
        </div>

        <button
          type="button"
          id="dailyActivityAccessCard"
          class="system-settings-menu-card"
          data-system-page="daily-activity-access"
        >
          <span class="system-settings-menu-icon daily-activity-access-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 3L19 6V11C19 16 16 19 12 21C8 19 5 16 5 11V6Z"></path>
              <path d="M9 12L11 14L15 10"></path>
            </svg>
          </span>

          <span class="system-settings-menu-content">
            <strong>Daily Activity Access</strong>
            <small>Configure Daily Activity visibility &amp; permissions</small>
          </span>

          <span class="system-settings-card-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M9 18l6-6-6-6"></path>
            </svg>
          </span>
        </button>

      </section>

    </section>

  </main>

  <script src="hexa-menu.js"></script>
  <script src="hexa-header.js"></script>
  <script src="system-settings.js"></script>

</body>
</html>
