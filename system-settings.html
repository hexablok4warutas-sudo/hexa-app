<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>System Settings | HEXA</title>


  <!-- GLOBAL HEXA HEADER -->
  <link
    rel="stylesheet"
    href="hexa-header.css"
  >


  <!-- SYSTEM SETTINGS -->
  <link
    rel="stylesheet"
    href="system-settings.css"
  >

</head>


<body>


  <!-- ==================================================
       GLOBAL HEXA HEADER
       ================================================== -->

  <header
    id="hexaHeader"
    data-header-type="standard"
    data-page="settings"
  ></header>



  <!-- ==================================================
       SYSTEM SETTINGS PAGE
       ================================================== -->

  <main
    id="systemSettingsPage"
    class="system-settings-page"
  >


    <!-- =================================================
         PAGE HEADING
         ================================================= -->

    <section class="system-settings-heading-shell">

      <div class="system-settings-heading">


        <!-- BACK -->

        <button
          type="button"
          id="systemSettingsBackButton"
          class="system-settings-back-button"
          aria-label="Back to Settings"
        >

          <svg viewBox="0 0 24 24">

            <path d="M15 18l-6-6 6-6"></path>

          </svg>

        </button>



        <!-- ICON -->

        <span
          class="system-settings-heading-icon"
          aria-hidden="true"
        >

          <svg viewBox="0 0 24 24">

            <circle
              cx="12"
              cy="12"
              r="3"
            ></circle>

            <path
              d="
                M19.4 15
                A1.7 1.7 0 0 0 19.7 16.9
                L19.8 17
                A2 2 0 1 1 17 19.8
                L16.9 19.7
                A1.7 1.7 0 0 0 15 19.4
                A1.7 1.7 0 0 0 14 20
                A1.7 1.7 0 0 0 13.6 21.1
                V21.2
                A2 2 0 1 1 9.6 21.2
                V21.1
                A1.7 1.7 0 0 0 8.6 19.4
                A1.7 1.7 0 0 0 6.7 19.7
                L6.6 19.8
                A2 2 0 1 1 3.8 17
                L3.9 16.9
                A1.7 1.7 0 0 0 4.6 15
                A1.7 1.7 0 0 0 4 14
                A1.7 1.7 0 0 0 2.9 13.6
                H2.8
                A2 2 0 1 1 2.8 9.6
                H2.9
                A1.7 1.7 0 0 0 4.6 8.6
                A1.7 1.7 0 0 0 4.3 6.7
                L4.2 6.6
                A2 2 0 1 1 7 3.8
                L7.1 3.9
                A1.7 1.7 0 0 0 9 4.6
                A1.7 1.7 0 0 0 10 4
                A1.7 1.7 0 0 0 10.4 2.9
                V2.8
                A2 2 0 1 1 14.4 2.8
                V2.9
                A1.7 1.7 0 0 0 15.4 4.6
                A1.7 1.7 0 0 0 17.3 4.3
                L17.4 4.2
                A2 2 0 1 1 20.2 7
                L20.1 7.1
                A1.7 1.7 0 0 0 19.4 9
                A1.7 1.7 0 0 0 20 10
                A1.7 1.7 0 0 0 21.1 10.4
                H21.2
                A2 2 0 1 1 21.2 14.4
                H21.1
                A1.7 1.7 0 0 0 19.4 15
                Z
              "
            ></path>

          </svg>

        </span>



        <!-- TITLE -->

        <div class="system-settings-heading-text">

          <h1>
            System Settings
          </h1>

          <p>
            Master Data &amp; Application Configuration
          </p>

        </div>


      </div>

    </section>



    <!-- =================================================
         CONTENT
         ================================================= -->

    <section class="system-settings-container">


      <!-- =================================================
           MASTER DATA
           ================================================= -->

      <section class="system-settings-section">

        <div class="system-settings-section-heading">

          <span
            class="system-settings-section-accent"
          ></span>

          <h2>
            MASTER DATA
          </h2>

        </div>



        <!-- POPULATION UNIT -->

        <button
          type="button"
          id="populationUnitCard"
          class="system-settings-menu-card"
          data-system-page="population-unit"
        >


          <!-- ICON -->

          <span
            class="
              system-settings-menu-icon
              population-unit-icon
            "
          >

            <svg viewBox="0 0 24 24">

              <path
                d="
                  M4 15
                  V10
                  L7 6
                  H17
                  L20 10
                  V15
                "
              ></path>

              <path
                d="
                  M3 15
                  H21
                  V18
                  H3
                  Z
                "
              ></path>

              <circle
                cx="7"
                cy="18"
                r="2"
              ></circle>

              <circle
                cx="17"
                cy="18"
                r="2"
              ></circle>

            </svg>

          </span>



          <!-- CONTENT -->

          <span class="system-settings-menu-content">

            <strong>
              Population Unit
            </strong>

            <small>
              Manage unit population, EGI and operational status
            </small>

          </span>



          <!-- ARROW -->

          <span
            class="system-settings-card-arrow"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">

              <path d="M9 18l6-6-6-6"></path>

            </svg>

          </span>


        </button>


      </section>


    </section>

  </main>



  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="hexa-menu.js"></script>

  <script src="hexa-header.js"></script>

  <script src="system-settings.js"></script>


</body>

</html>
