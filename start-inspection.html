<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Start Inspection | HEXA</title>


  <!-- =====================================
       GLOBAL HEXA HEADER
       ===================================== -->

  <link
    rel="stylesheet"
    href="hexa-header.css"
  >


  <!-- =====================================
       START INSPECTION STYLE
       ===================================== -->

  <link
    rel="stylesheet"
    href="start-inspection.css"
  >

</head>


<body>


  <!-- =====================================
       GLOBAL HEXA HEADER
       ===================================== -->

  <header
    id="hexaHeader"
    data-header-type="standard"
    data-page="start-inspection"
    data-active-nav="daily-maintenance"
  ></header>



  <!-- =====================================
       START INSPECTION PAGE
       ===================================== -->

  <main class="inspection-page">

    <section class="inspection-container">


      <!-- =================================
           TITLE
           ================================= -->

      <div class="inspection-title">

        <img
          src="hexa-icon-startinspection-noline.png"
          alt="Start Inspection"
        >

        <h1>
          Start Your Inspection
        </h1>

      </div>



      <!-- =================================
           FORM
           ================================= -->

      <form
        id="inspectionForm"
        class="inspection-form"
      >


        <!-- ===============================
             UNIT CODE
             =============================== -->

        <div class="form-group">

          <label for="unitCode">
            UNIT CODE <span>*</span>
          </label>

          <select
            id="unitCode"
            name="unitCode"
            required
          >

            <option value="">
              Search / Select Unit
            </option>

            <option value="HEX 1205">
              HEX 1205
            </option>

            <option value="HEX 1207">
              HEX 1207
            </option>

            <option value="HEX 1210">
              HEX 1210
            </option>

          </select>

        </div>



        <!-- ===============================
             HM INSPECTION
             =============================== -->

        <div class="form-group">

          <label>
            HM Inspection <span>*</span>
          </label>


          <div class="number-control">


            <button
              type="button"
              id="hmMinus"
              class="number-button"
            >
              −
            </button>


            <input
              type="number"
              id="hmInspection"
              name="hmInspection"
              value="0"
              min="0"
              step="1"
              required
            >


            <button
              type="button"
              id="hmPlus"
              class="number-button"
            >
              +
            </button>


          </div>

        </div>



        <!-- ===============================
             DATE
             =============================== -->

        <div class="form-group">

          <label for="dateInspection">
            Date Inspection
          </label>

          <input
            type="date"
            id="dateInspection"
            name="dateInspection"
          >

        </div>



        <!-- ===============================
             PHOTO
             =============================== -->

        <div class="form-group">

          <label for="inspectionPhoto">
            Photo <span>*</span>
          </label>


          <label
            class="photo-input"
            for="inspectionPhoto"
          >


            <input
              type="file"
              id="inspectionPhoto"
              name="inspectionPhoto"
              accept="image/*"
              capture="environment"
              required
            >


            <div class="camera-icon">

              <svg viewBox="0 0 24 24">

                <path
                  d="M9 4l1.5-2h3L15 4h4a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h4z"
                ></path>

                <circle
                  cx="12"
                  cy="12"
                  r="4"
                ></circle>

              </svg>

            </div>


            <span id="photoText">
              Add Inspection Photo
            </span>


          </label>


          <div
            class="photo-preview"
            id="photoPreviewContainer"
            hidden
          >

            <img
              id="photoPreview"
              alt="Inspection Preview"
            >

          </div>

        </div>



        <!-- ===============================
             GROUP COMPONENT
             =============================== -->

        <div class="form-group">

          <label for="groupComponent">
            Group Component <span>*</span>
          </label>


          <select
            id="groupComponent"
            name="groupComponent"
            required
          >

            <option value="">
              Search / Select Component
            </option>

            <option value="ENGINE">
              ENGINE
            </option>

            <option value="TRANSMISSION">
              TRANSMISSION
            </option>

            <option value="HYDRAULIC SYSTEM">
              HYDRAULIC SYSTEM
            </option>

            <option value="SWING & TRAVEL">
              SWING &amp; TRAVEL
            </option>

            <option value="FINAL DRIVE">
              FINAL DRIVE
            </option>

            <option value="UNDER CARRIAGE">
              UNDER CARRIAGE
            </option>

          </select>

        </div>



        <!-- ===============================
             PROBLEM DESCRIPTION
             =============================== -->

        <div class="form-group">

          <label for="problemDescription">
            Problem Description <span>*</span>
          </label>

          <textarea
            id="problemDescription"
            name="problemDescription"
            rows="3"
            required
          ></textarea>

        </div>



        <!-- ===============================
             RATING
             =============================== -->

        <div class="form-group">

          <label>
            Rating <span>*</span>
          </label>


          <div class="rating-grid">


            <button
              type="button"
              class="rating-button"
              data-rating="RATE A"
            >
              RATE A
            </button>


            <button
              type="button"
              class="rating-button"
              data-rating="RATE B"
            >
              RATE B
            </button>


            <button
              type="button"
              class="rating-button"
              data-rating="RATE C"
            >
              RATE C
            </button>


            <button
              type="button"
              class="rating-button"
              data-rating="RATE X"
            >
              RATE X
            </button>


          </div>


          <input
            type="hidden"
            id="rating"
            name="rating"
            required
          >

        </div>



        <!-- ===============================
             PART REQUIREMENT
             =============================== -->

        <div
          class="form-group part-requirement-group"
          id="partRequirementGroup"
        >

          <label class="part-requirement-main-label">
            Part Requirement
          </label>


          <!--
            Repeating Part Container

            JavaScript nantinya akan:
            - menambahkan Part 2, Part 3, dst.
            - menghapus part
            - melakukan renumbering
            - menggabungkan data menjadi multiline
          -->

          <div
            id="partRequirementList"
            class="part-requirement-list"
          >


            <!-- ===========================
                 PART ITEM 1
                 =========================== -->

            <div
              class="part-requirement-item"
              data-part-index="1"
            >


              <!-- PART HEADER -->

              <div class="part-item-header">

                <div class="part-item-title">
                  Part 1
                </div>


                <button
                  type="button"
                  class="remove-part-button"
                  aria-label="Remove Part 1"
                >
                  Remove Part
                </button>

              </div>



              <!-- PART DESCRIPTION -->

              <div class="part-field">

                <label>
                  Part Description
                </label>

                <input
                  type="text"
                  class="part-description-input"
                  autocomplete="off"
                  placeholder="Input Part Description"
                >

              </div>



              <!-- PART NO + QTY -->

              <div class="part-row">


                <div class="part-field part-no-field">

                  <label>
                    Part No.
                  </label>

                  <input
                    type="text"
                    class="part-no-input"
                    autocomplete="off"
                    placeholder="Input Part No."
                  >

                </div>


                <div class="part-field quantity-field">

                  <label>
                    Qty
                  </label>

                  <input
                    type="number"
                    class="part-quantity-input"
                    min="0"
                    step="1"
                    inputmode="numeric"
                    placeholder="0"
                  >

                </div>


              </div>


            </div>

          </div>



          <!-- ===============================
               ADD PART
               =============================== -->

          <div class="add-part-area">

            <button
              type="button"
              id="addPartButton"
              class="add-part-button"
            >

              <span
                class="add-part-icon"
                aria-hidden="true"
              >
                +
              </span>

              <span>
                Add Part
              </span>

            </button>

          </div>



          <!-- ===============================
               HIDDEN DATABASE FIELDS

               Tetap mempertahankan struktur
               payload/backend lama:
               - partsDescription
               - partNo
               - quantity
               =============================== -->

          <input
            type="hidden"
            id="partsDescription"
            name="partsDescription"
          >

          <input
            type="hidden"
            id="partNo"
            name="partNo"
          >

          <input
            type="hidden"
            id="quantity"
            name="quantity"
          >


        </div>



        <!-- ===============================
             INSPECTORS
             =============================== -->

        <div class="form-group">

          <label for="inspectors">
            Inspectors <span>*</span>
          </label>

          <input
            type="text"
            id="inspectors"
            name="inspectors"
            required
          >

        </div>



        <!-- ===============================
             NOTES
             =============================== -->

        <div class="form-group">

          <label for="notes">
            Notes
          </label>

          <textarea
            id="notes"
            name="notes"
            rows="3"
          ></textarea>

        </div>



        <!-- ===============================
             SUBMIT
             =============================== -->

        <div class="submit-area">

          <button
            type="submit"
            class="submit-button"
          >

            <span class="submit-icon">
              ✓
            </span>

            <span>
              Submit Inspection
            </span>

          </button>

        </div>


      </form>

    </section>

  </main>



  <!-- =====================================
       JAVASCRIPT
       ===================================== -->


  <!-- GLOBAL MENU DATA -->

  <script src="hexa-menu.js"></script>


  <!-- GLOBAL HEADER -->

  <script src="hexa-header.js"></script>


  <!-- START INSPECTION -->

  <script src="start-inspection.js"></script>


</body>

</html>
