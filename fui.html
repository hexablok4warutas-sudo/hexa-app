<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FUI | HEXA</title><link rel="stylesheet" href="hexa-header.css"><link rel="stylesheet" href="fui.css"></head><body>
<header id="hexaHeader" data-header-type="standard" data-page="fui"></header>
<main class="fui-wrap">
<section class="hero"><div><div class="muted">HEXA • HEAVY EQUIPMENT XCELLENT APPS</div><h1>FUI Monitoring</h1><div class="muted">Follow Up Inspection • Unit Track</div></div><img class="hero-icon" src="hexa-icon-svg-fui.svg" alt="FUI"></section>
<div class="preview-note" id="connectionNotice">Mode demo lokal: data contoh, belum terhubung ke database HEXA. Hubungkan adapter backend sebelum dipakai operasional.</div>
<div class="toolbar"><select id="period"><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select><input type="date" id="referenceDate"><button class="btn orange" id="createBtn" hidden>+ Create FUI</button><button class="btn alt" id="refreshBtn">Refresh</button></div>
<section class="stats" id="stats"></section>
<section class="panel"><h2>Overall Achievement • Unit Track</h2><div class="charts" id="overallCharts"></div></section>
<section class="panel"><h2>Achievement by EGI</h2><div class="egi-grid" id="egiCharts"></div></section>
<section class="panel"><h2>FUI Worklist</h2><div class="filters"><select id="egiFilter"><option value="ALL">All EGI</option></select><select id="statusFilter"><option value="ALL">All Status</option><option value="OPEN">Open</option><option value="PENDING">Pending Verification</option><option value="CONTINUE MONITORING">Continue Monitoring</option><option value="CLOSE">Close</option></select><input id="search" placeholder="Search unit / finding / FUI ID"></div><div class="worklist" id="worklist" style="margin-top:16px"></div></section>
</main>
<dialog id="createDialog"><h2>Create FUI</h2><form id="createForm"><div class="detail-grid"><div class="field"><label>Unit Code</label><input name="unitCode" required></div><div class="field"><label>EGI</label><input value="Otomatis dari master Populasi" disabled></div><div class="field"><label>PIC</label><input name="pic" required></div><div class="field"><label>Target Date</label><input type="date" name="targetDate" required></div></div><div class="field"><label>Previous Finding</label><textarea name="finding" required></textarea></div><div class="field"><label>Previous Analysis</label><textarea name="analysis"></textarea></div><div class="field"><label>Recommended Follow Up</label><textarea name="recommendation" required></textarea></div><div class="field"><label>Finding Photos (optional)</label><input type="file" name="findingFiles" multiple accept="image/*"></div><div class="modal-actions"><button type="button" class="btn alt" id="cancelCreate">Cancel</button><button type="submit" class="btn">Save FUI</button></div></form></dialog>
<script src="hexa-menu.js"></script><script src="hexa-header.js"></script><script src="fui.js"></script></body></html>
